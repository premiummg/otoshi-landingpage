<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ?v=2 on the icon links, not just the bare path: browsers cache a
     favicon separately from the page's own cache (a hard reload doesn't
     touch it), keyed by this exact URL - changing the URL is what actually
     forces a refetch instead of relying on someone clearing site data. Bump
     the version again if the icon itself ever changes and still shows the
     old one. -->
<link rel="icon" type="image/png" href="/media/logo.png?v=2">
<link rel="apple-touch-icon" href="/media/logo.png?v=2">
<meta name="theme-color" content="#1A2C6E">
<!-- max-image-preview:large opts the club's photos into full-size thumbnails
     in Google results instead of the default postage stamp - for a local
     sports club the photo is most of what makes the listing worth clicking. -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<!-- The hero image is the largest element painted above the fold, so it is
     what Largest Contentful Paint is measured against. Preloading it starts
     the download alongside the JS bundle rather than after the component
     that references it has mounted. -->
<link rel="preload" as="image" href="/media/hero-poster.webp" fetchpriority="high">
<!-- Everything between these markers is replaced per route at build time by
     scripts/prerender.mjs (title, description, canonical, hreflang, Open
     Graph, JSON-LD). What is written here is only what `vite dev` shows,
     since dev never runs the prerender step. -->
<!--seo-start-->
<title>Judo Classes in Dieppe &amp; Moncton, NB | Judo Otoshi</title>
<meta name="description" content="Judo for kids, teens and adults in Dieppe, NB. Certified senseis and classes for ages 4 and up, serving Greater Moncton since 2012. Free trial class.">
<!--seo-end-->
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body>
<div id="root"><!--app-html--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
